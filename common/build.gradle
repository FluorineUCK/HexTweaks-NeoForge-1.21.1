architectury {
    common(rootProject.enabled_platforms.split(",")) {
        it.platformPackage "neoforge", "forge"
    }
}

dependencies {
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    // The official pre-39 publication has no separate devruntime artifact.
    // Compile common against the same plain NeoForge jar used at launch.
    compileOnly files("${rootProject.rootDir}/libs/hexcasting-neoforge-${rootProject.minecraft_version}-${rootProject.hexcasting_version}.jar")
    modCompileOnly "cc.tweaked:cc-tweaked-${rootProject.minecraft_version}-forge-api:${rootProject.cct_version}"
    modCompileOnly "cc.tweaked:cc-tweaked-${rootProject.minecraft_version}-forge:${rootProject.cct_version}"
    modCompileOnly "org.squiddev:Cobalt:0.7.3"
    modCompileOnly files("${rootProject.rootDir}/libs/Patchouli-${rootProject.patchouli_version}.jar")
    modCompileOnly files("${rootProject.rootDir}/libs/hexal-0.3.1+1.21.1-neoforge-pre39.jar")
    modCompileOnly files("${rootProject.rootDir}/libs/moreiotas-0.1.1+1.21.1-neoforge-pre39.jar")
    compileOnly group: "org.ejml", name: "ejml-simple", version: "0.45.1"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
